[project]
name = "synocli-e2e"
version = "0.0.0"
description = "End-to-end test suite for synocli against a real Synology NAS."
requires-python = ">=3.10"
dependencies = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "pytest-subtests>=0.13",
]

[tool.pytest.ini_options]
# Mirror the per-file pytest.ini so plain `pytest tests_e2e/` works either way.
testpaths = ["tests"]
addopts = "-p no:cacheprovider --strict-markers"
markers = [
  "fs: file station tests",
  "ds: download station tests",
  "slow: tests that exercise long-running operations",
]
